<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Search – Cobbleford Home &amp; Garden</title>
<link rel="stylesheet" href="shop.css">
<script src="shop.js"></script>
</head>
<body>
<div id="top"></div>
<main class="wrap">
<h1 id="h"></h1>
<p id="n" class="small"></p>
<div class="grid" id="grid"></div>
</main>
<div id="bottom"></div>
<script>frame();
var q = (param("q") || "").trim(), cat = param("cat");
var words = q.toLowerCase().split(/\s+/).filter(Boolean);
var hits = PRODUCTS.filter(function (p) {
  if (cat) return p.cat === cat;
  var hay = (p.name + " " + p.tags + " " + p.cat).toLowerCase();
  return words.length && words.every(function (w) { return hay.indexOf(w) > -1 || hay.indexOf(w.replace(/s$/, "")) > -1; });
});
var label = cat ? cat : "\u201c" + q + "\u201d";
document.title = (cat ? cat : "Search results for " + q) + " \u2013 Cobbleford Home & Garden";
document.getElementById("h").textContent = cat ? cat : "Search results for " + label;
document.getElementById("n").textContent = hits.length + (hits.length === 1 ? " product" : " products");
document.getElementById("grid").innerHTML = hits.length ? hits.map(card).join("") :
  '<p>Sorry, we couldn\u2019t find anything matching ' + esc(label) + '. Try another word.</p>';</script>
</body>
</html>
